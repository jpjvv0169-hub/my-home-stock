
<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ef4d98">
<title>My Home Stock – Pink 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:#702344;background:linear-gradient(145deg,#ffd1e6,#fff3f9 50%,#ffd6e9);min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
header{text-align:center;padding:26px 12px;background:linear-gradient(135deg,#ffb9d9,#f47ab3,#ffc6df);border-radius:0 0 30px 30px;box-shadow:0 8px 20px #b74c8055}
header h1{color:white;text-shadow:0 3px #b82c70,0 6px 9px #92295a88;font-size:30px;margin:5px}
header p{font-weight:bold;color:#a21d60}
main{max-width:750px;margin:auto;padding:14px 14px 115px}
.card{background:linear-gradient(145deg,#fffaff,#ffd8ea);border:2px solid white;border-radius:25px;padding:17px;margin:14px 0;box-shadow:6px 9px 17px #b6477938,inset 3px 3px 5px white}
.card h2{margin:0 0 14px;font-size:21px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:linear-gradient(145deg,#fffaff,#ffd1e7);border:2px solid white;border-radius:22px;padding:15px;box-shadow:4px 6px 12px #a83a7233}
.tile .emoji{font-size:29px}
.tile strong{display:block;color:#d91a73;font-size:29px;margin:8px 0}
.tile small{font-weight:bold}
.btn{border:2px solid #ffc0dd;border-radius:18px;padding:13px 15px;color:white;font-weight:bold;background:linear-gradient(#ff91c3,#f32688 55%,#c30d61);box-shadow:inset 0 3px 5px #fff9,0 5px 0 #aa185a,0 8px 12px #a3326c44;margin:5px 0}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #aa185a}
.secondary{background:linear-gradient(#fffaff,#ffc3df);color:#ad2163;text-shadow:none;box-shadow:inset 0 3px 5px white,0 4px 0 #df86b2}
.danger{background:linear-gradient(#ffb3c9,#ed668c)}
.full{width:100%}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.actions .btn{flex:1}
input,select{width:100%;padding:13px;border:2px solid #eeb6d2;border-radius:15px;background:#fffaff;color:#692443}
label{display:block;margin:13px 0 5px;font-weight:bold;font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
.item{border-bottom:1px solid #eab7cf;padding:13px 0}
.item:last-child{border:0}
.muted{color:#985b79;font-size:13px}
.good{color:#187e4c}
.warn{color:#a55700}
.note{background:#fff1c8;border-radius:15px;padding:12px;margin:10px 0}
.pic{width:78px;height:78px;object-fit:contain;border-radius:13px;background:white}
.preview{max-width:180px;max-height:180px;border-radius:15px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;z-index:10;background:linear-gradient(#fff5fc,#ffc2de);padding:9px 4px 13px;border-radius:22px 22px 0 0;box-shadow:0 -5px 18px #a3326b44}
nav button{flex:1;min-width:0;border:0;background:transparent;color:#91395f;border-radius:14px;font-size:11px;font-weight:bold;padding:8px 1px}
nav span{display:block;font-size:24px}
nav .active{background:linear-gradient(#ff93c3,#ed3189);color:white;box-shadow:0 4px 8px #a3326b55}
video{width:100%;max-height:300px;border-radius:17px;background:#222}
a{color:#bd1766;overflow-wrap:anywhere}
hr{border:0;border-top:1px solid #e8b4ce}
.hidden{display:none}
#status{text-align:center;font-size:12px;color:#ad3873}
</style>
</head>
<body>
<header>
<div style="font-size:43px">🏡🛒🌸</div>
<h1>My Home Stock</h1>
<p id="subtitle">💗 Louise se slim huisvoorraad 💗</p>
</header>
<main>
<div id="app"></div>
<p id="status"></p>
</main>
<nav id="nav"></nav>

<script>
"use strict";

const KEY="my-home-stock-data-v1";
const FOOD="https://world.openfoodfacts.org/api/v2/product/";
const BEAUTY="https://world.openbeautyfacts.org/api/v2/product/";

const shops={
ZA:[
["Checkers","https://www.checkers.co.za/"],
["Shoprite","https://www.shoprite.co.za/"],
["Pick n Pay","https://www.pnp.co.za/"],
["Woolworths","https://www.woolworths.co.za/"],
["Makro","https://www.makro.co.za/"],
["Clicks","https://clicks.co.za/"],
["Dis-Chem","https://www.dischem.co.za/"],
["SPAR","https://www.spar.co.za/"]
],
MZ:[
["SPAR Mozambique","https://www.google.com/search?q=SPAR+Mozambique"],
["Shoprite Mozambique","https://www.google.com/search?q=Shoprite+Mozambique"],
["Maputo winkels","https://www.google.com/search?q=supermercados+Maputo"]
]
};

const fresh=()=>({
lang:"af",currency:"ZAR",budget:0,
products:[],manual:[],history:[],prices:[]
});

let data;
try{
data=JSON.parse(localStorage.getItem(KEY))||fresh();
if(!Array.isArray(data.products))throw Error();
data.manual=Array.isArray(data.manual)?data.manual:[];
data.history=Array.isArray(data.history)?data.history:[];
data.prices=Array.isArray(data.prices)?data.prices:[];
}catch(e){data=fresh()}

let page="home";
let editing="";
let photoData="";
let found=null;
let stream=null;
let scanning=false;
let scanTimer=null;

const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=(n,c=data.currency)=>(c==="MZN"?"MT ":"R ")+Number(n||0).toFixed(2);
const low=p=>Number(p.qty)<=Number(p.min);
const need=p=>Math.max(0,Number(p.target)-Number(p.qty));
const cats=["Koskas","Yskas","Vrieskas","Badkamer","Skoonmaak","Medisyne","Ander"];
const units=["packs","items","bottels","blikkies","kg","g","L","ml"];
const lang=()=>data.lang==="en";
const tx=(af,en)=>lang()?en:af;

function save(){
try{
localStorage.setItem(KEY,JSON.stringify(data));
$("status").textContent="✓ "+tx("Outomaties gestoor","Automatically saved");
return true;
}catch(e){
alert(tx("Stoorplek vol. Maak 'n rugsteun.","Storage full. Make a backup."));
return false;
}
}

function go(p){
stopCamera();
page=p;
render();
window.scrollTo(0,0);
}

function render(){
$("subtitle").textContent=tx("💗 Louise se slim huisvoorraad 💗","💗 Louise's smart home inventory 💗");
const tabs=[
["home","🏠",tx("Tuis","Home")],
["stock","📦",tx("Voorraad","Stock")],
["scan","📸",tx("Skandeer","Scan")],
["shopping","🛒",tx("Inkopies","Shopping")],
["settings","⚙️",tx("Instellings","Settings")]
];
$("nav").innerHTML=tabs.map(t=>`<button class="${page===t[0]?"active":""}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join("");
({home,stock,scan:scanPage,shopping,settings})[page]();
}

function home(){
let products=data.products.length;
let lows=data.products.filter(low).length;
let needed=data.products.filter(p=>need(p)>0).length;
let month=new Date().toISOString().slice(0,7);
let spent=data.history.filter(h=>h.type==="buy"&&String(h.date||"").startsWith(month)).reduce((a,h)=>a+Number(h.total||0),0);
$("app").innerHTML=`
<div class="grid">
<div class="tile"><div class="emoji">📦</div><strong>${products}</strong><small>${tx("Produkte","Products")}</small></div>
<div class="tile"><div class="emoji">⚠️</div><strong>${lows}</strong><small>${tx("Min voorraad","Low stock")}</small></div>
<div class="tile"><div class="emoji">🛒</div><strong>${needed+data.manual.length}</strong><small>${tx("Inkopies","Shopping")}</small></div>
<div class="tile"><div class="emoji">💰</div><strong style="font-size:20px">${money(spent)}</strong><small>${tx("Hierdie maand bestee","Spent this month")}</small></div>
</div>
<section class="card">
<h2>🌸 ${tx("Welkom by jou kombuis","Welcome to your kitchen")}</h2>
<p>${tx("Hou jou huisvoorraad slim en maklik op datum.","Keep your home inventory organized.")}</p>
<div class="actions">
<button class="btn" onclick="go('scan')">📸 ${tx("Maak kamera oop","Open camera")}</button>
<button class="btn secondary" onclick="editor('')">➕ ${tx("Voeg produk by","Add product")}</button>
</div>
</section>
<section class="card">
<h2>🛒 ${tx("Outomatiese inkopielys","Automatic shopping list")}</h2>
<p>${needed} ${tx("produkte benodig aanvulling","products need restocking")}</p>
<button class="btn full" onclick="go('shopping')">${tx("Bekyk inkopielys","View shopping list")}</button>
</section>
<section class="card">
<h2>💗 ${tx("Slim prysvergelyking","Smart price comparison")}</h2>
<p>${tx("Soek pryse in Suid-Afrika en Mosambiek en stoor die pryse wat jy bevestig.","Search South African and Mozambican stores and save verified prices.")}</p>
<button class="btn full" onclick="go('scan')">🔎 ${tx("Soek winkelpryse","Search store prices")}</button>
</section>`;
}

function stock(){
$("app").innerHTML=`
<section class="card">
<h2>📦 ${tx("My voorraad","My stock")}</h2>
<button class="btn full" onclick="editor('')">➕ ${tx("Voeg produk by","Add product")}</button>
<input id="filter" placeholder="${tx("Soek produk of barcode","Search product or barcode")}" oninput="stockList()">
<div id="stockList"></div>
</section>`;
stockList();
}

function stockList(){
const q=($("filter")?.value||"").toLowerCase();
const arr=data.products.filter(p=>(p.name+" "+(p.barcode||"")).toLowerCase().includes(q));
$("stockList").innerHTML=arr.length?arr.map(p=>`
<div class="item">
<div class="row">
${p.image?`<img class="pic" src="${esc(p.image)}">`:`<div style="font-size:40px">📦</div>`}
<div class="grow">
<b>${esc(p.name)}</b><br>
<span class="muted">${esc(cats[p.cat]||p.cat||"Ander")} · ${esc(p.barcode||"")}</span><br>
<strong class="${low(p)?"warn":"good"}">${Number(p.qty)||0} ${esc(p.unit||"items")}</strong>
</div>
</div>
<div class="actions">
<button class="btn secondary" onclick="changeQty('${p.id}',-1)">➖ ${tx("Gebruik","Use")}</button>
<button class="btn secondary" onclick="changeQty('${p.id}',1)">➕ ${tx("Koop","Buy")}</button>
<button class="btn" onclick="editor('${p.id}')">✏️ ${tx("Wysig","Edit")}</button>
<button class="btn secondary" onclick="compare('${p.id}')">🔎 ${tx("Pryse","Prices")}</button>
</div>
</div>`).join(""):`<p>${tx("Geen produkte gevind nie.","No products found.")}</p>`;
}

function changeQty(id,delta){
const p=data.products.find(x=>x.id===id);
if(!p)return;
let amount=Number(prompt(tx("Hoeveel eenhede?","How many units?"),"1"));
if(!Number.isFinite(amount)||amount<=0)return;
if(delta<0)amount=Math.min(amount,Number(p.qty));
p.qty=Math.max(0,Number(p.qty)+delta*amount);
data.history.push({
id:uid(),pid:id,type:delta>0?"buy":"use",
qty:amount,total:delta>0?amount*Number(p.price||0):0,
date:new Date().toISOString()
});
save();render();
}

function editor(id,seed={}){
editing=id;
const p=data.products.find(x=>x.id===id)||seed;
photoData=p.image||"";
page="stock";
render();
$("app").innerHTML=`
<section class="card">
<h2>🌷 ${id?tx("Wysig produk","Edit product"):tx("Nuwe produk","New product")}</h2>
<label>${tx("Produknaam","Product name")}</label>
<input id="pName" value="${esc(p.name||"")}">
<label>Barcode</label>
<input id="pBarcode" value="${esc(p.barcode||"")}">
<label>${tx("Kategorie","Category")}</label>
<select id="pCat">${cats.map((c,i)=>`<option value="${i}" ${Number(p.cat||0)===i?"selected":""}>${c}</option>`).join("")}</select>
<label>${tx("Hoeveelheid","Quantity")}</label>
<input id="pQty" type="number" min="0" step="any" value="${p.qty??1}">
<label>${tx("Eenheid","Unit")}</label>
<select id="pUnit">${units.map(u=>`<option ${p.unit===u?"selected":""}>${u}</option>`).join("")}</select>
<label>${tx("Minimum voorraad","Minimum stock")}</label>
<input id="pMin" type="number" min="0" step="any" value="${p.min??1}">
<label>${tx("Teikenvoorraad","Target stock")}</label>
<input id="pTarget" type="number" min="0" step="any" value="${p.target??2}">
<label>${tx("Prys per eenheid","Price per unit")} (${data.currency})</label>
<input id="pPrice" type="number" min="0" step="any" value="${p.price??0}">
<label>${tx("Produkfoto","Product photo")}</label>
<input type="file" accept="image/*" onchange="readPhoto(this)">
<div id="photoBox">${photoData?`<img class="preview" src="${esc(photoData)}">`:""}</div>
<button class="btn full" onclick="saveProduct()">💾 ${tx("Stoor produk","Save product")}</button>
${id?`<button class="btn danger full" onclick="deleteProduct('${id}')">🗑️ ${tx("Verwyder produk","Delete product")}</button>`:""}
<button class="btn secondary full" onclick="go('stock')">${tx("Kanselleer","Cancel")}</button>
</section>`;
}

function readPhoto(input){
const file=input.files?.[0];
if(!file)return;
const r=new FileReader();
r.onload=()=>{
const img=new Image();
img.onload=()=>{
const c=document.createElement("canvas");
const scale=Math.min(1,550/Math.max(img.width,img.height));
c.width=Math.max(1,Math.round(img.width*scale));
c.height=Math.max(1,Math.round(img.height*scale));
c.getContext("2d").drawImage(img,0,0,c.width,c.height);
photoData=c.toDataURL("image/jpeg",0.72);
$("photoBox").innerHTML=`<img class="preview" src="${photoData}">`;
};
img.src=r.result;
};
r.readAsDataURL(file);
}

function saveProduct(){
const name=$("pName").value.trim();
const barcode=$("pBarcode").value.trim();
const qty=Number($("pQty").value);
const min=Number($("pMin").value);
const target=Number($("pTarget").value);
const price=Number($("pPrice").value);
if(!name||[qty,min,target,price].some(v=>!Number.isFinite(v)||v<0)||target<min){
alert(tx("Kontroleer die waardes. Teiken mag dieselfde as minimum wees.","Check values. Target may equal minimum."));
return;
}
if(barcode&&data.products.some(p=>p.barcode===barcode&&p.id!==editing)){
alert(tx("Barcode bestaan reeds.","Barcode already exists."));return;
}
const old=data.products.find(p=>p.id===editing);
const p={
...(old||{}),id:editing||uid(),name,barcode,
cat:Number($("pCat").value),qty,
unit:$("pUnit").value,min,target,price,
currency:data.currency,image:photoData
};
if(old)data.products=data.products.map(x=>x.id===editing?p:x);
else data.products.push(p);
if(save())go("stock");
}

function deleteProduct(id){
if(!confirm(tx("Verwyder hierdie produk?","Delete this product?")))return;
data.products=data.products.filter(p=>p.id!==id);
save();go("stock");
}

function scanPage(){
$("app").innerHTML=`
<section class="card">
<h2>📸 ${tx("Skandeer produk","Scan product")}</h2>
<div class="actions">
<button class="btn" onclick="startCamera()">📷 ${tx("Maak kamera oop","Open camera")}</button>
<button class="btn secondary" onclick="stopCamera()">⏹️ ${tx("Stop kamera","Stop camera")}</button>
</div>
<video id="video" autoplay muted playsinline></video>
<p class="muted">${tx("Gebruik Chrome en gee kameratoestemming.","Use Chrome and allow camera access.")}</p>
<label>Barcode</label>
<input id="scanCode" inputmode="numeric" placeholder="6001234567890">
<button class="btn full" onclick="lookupCode()">🔎 ${tx("Soek produk","Find product")}</button>
<div id="scanResult"></div>
</section>`;
}

async function startCamera(){
if(!navigator.mediaDevices?.getUserMedia){
alert(tx("Kamera word nie ondersteun nie.","Camera not supported."));return;
}
if(!("BarcodeDetector" in window)){
alert(tx("Hierdie blaaier ondersteun nie outomatiese barcode-skandering nie. Tik die barcode self.","This browser does not support automatic barcode scanning. Enter it manually."));
return;
}
try{
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
$("video").srcObject=stream;
const detector=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]});
scanning=true;
const tick=async()=>{
if(!scanning)return;
try{
if($("video")?.readyState>=2){
const codes=await detector.detect($("video"));
if(codes.length){
const code=codes[0].rawValue;
stopCamera();
$("scanCode").value=code;
lookupCode();
return;
}
}
}catch(e){}
scanTimer=setTimeout(tick,350);
};
tick();
}catch(e){alert(tx("Kan nie kamera oopmaak nie.","Cannot open camera."));}
}

function stopCamera(){
scanning=false;
clearTimeout(scanTimer);
if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
}

async function lookupCode(){
const code=$("scanCode").value.trim();
if(!/^[0-9]{8,14}$/.test(code)){
alert(tx("Voer 'n geldige barcode in.","Enter a valid barcode."));return;
}
stopCamera();
const existing=data.products.find(p=>p.barcode===code);
if(existing){found=existing;showFound(true);return;}
$("scanResult").innerHTML=`<div class="card">🔎 ${tx("Soek tans...","Searching...")}</div>`;
found={barcode:code,name:"",image:"",qty:1,min:1,target:2,price:0,unit:"packs",cat:0};
for(const base of [FOOD,BEAUTY]){
try{
const r=await fetch(base+encodeURIComponent(code)+".json");
if(!r.ok)continue;
const j=await r.json();
if(j.status===1&&j.product){
const p=j.product;
found.name=p.product_name||p.product_name_en||p.brands||"";
found.image=p.image_front_url||p.image_url||"";
break;
}
}catch(e){}
}
showFound(false);
}

function showFound(existing){
$("scanResult").innerHTML=`
<div class="card">
<h2>${existing?"📦":"🔎"} ${esc(found.name||tx("Produk nie gevind nie","Product not found"))}</h2>
${found.image?`<img class="preview" src="${esc(found.image)}">`:""}
<p class="muted">Barcode: ${esc(found.barcode)}</p>
<button class="btn full" onclick="registerFound()">${existing?tx("Wysig produk","Edit product"):tx("Voeg produk by","Add product")}</button>
<button class="btn secondary full" onclick="compareFound()">🌍 ${tx("Soek winkelpryse","Search store prices")}</button>
</div>`;
}

function registerFound(){
const p=found;
if(!p)return;
editor(data.products.find(x=>x.barcode===p.barcode)?.id||"",p);
}

function compareFound(){
if(found)compare("",found);
}

function compare(id,seed=null){
const p=data.products.find(x=>x.id===id)||seed;
if(!p)return;
page="scan";
render();
const q=[p.name,p.barcode].filter(Boolean).join(" ");
const saved=data.prices.filter(x=>x.barcode===p.barcode||(x.name&&x.name===p.name));
$("app").innerHTML=`
<section class="card">
<h2>🌍 ${tx("Vergelyk winkelpryse","Compare store prices")}</h2>
<h3>${esc(p.name||p.barcode)}</h3>
<p class="muted">${tx("Soek pryse op verskillende winkels se webwerwe. Nie alle winkels laat outomatiese prysuitlees toe nie.","Search prices on different store websites. Not all stores allow automatic price extraction.")}</p>
<label>${tx("Soekland","Search country")}</label>
<select id="country" onchange="storeLinks()">
<option value="ZA">🇿🇦 Suid-Afrika</option>
<option value="MZ">🇲🇿 Mosambiek</option>
</select>
<div id="storeLinks"></div>
</section>
<section class="card">
<h2>💰 ${tx("Bevestigde pryse","Confirmed prices")}</h2>
<div id="savedPrices"></div>
</section>
<section class="card">
<h2>➕ ${tx("Stoor winkelprys","Save store price")}</h2>
<label>${tx("Winkelnaam","Store name")}</label>
<input id="shopName" placeholder="Checkers / Shoprite / SPAR">
<label>${tx("Prys","Price")}</label>
<input id="shopPrice" type="number" min="0" step="0.01">
<label>${tx("Geldeenheid","Currency")}</label>
<select id="shopCurrency"><option value="ZAR">ZAR – Rand</option><option value="MZN">MZN – Metical</option></select>
<label>${tx("Produkbladsy (opsioneel)","Product URL (optional)")}</label>
<input id="shopUrl" placeholder="https://...">
<button class="btn full" onclick="addPrice('${esc(p.barcode||"")}','${esc(p.name||"")}')">💾 ${tx("Stoor prys","Save price")}</button>
</section>`;
window.currentCompare=p;
storeLinks();
savedPrices();
}

function storeLinks(){
const country=$("country").value;
const p=window.currentCompare;
const query=[p.name,p.barcode].filter(Boolean).join(" ");
const list=shops[country];
$("storeLinks").innerHTML=`
<div class="note">
${tx("Tik op 'n winkel om sy produkte te soek. Bevestig self die prys en verpakking voordat jy dit stoor.","Tap a store to search its products. Verify price and pack size before saving.")}
</div>
${list.map(([name,url])=>{
const domain=(()=>{try{return new URL(url).hostname}catch(e){return""}})();
const search=domain.includes("google.com")
?url+"+"+encodeURIComponent(query)
:"https://www.google.com/search?q="+encodeURIComponent(query+" site:"+domain);
return `<div class="item"><b>🏪 ${esc(name)}</b><br><a href="${esc(search)}" target="_blank" rel="noopener noreferrer">${tx("Soek prys by winkel","Search store price")}</a></div>`;
}).join("")}
<div class="item"><a target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=${encodeURIComponent(query+" price "+(country==="ZA"?"South Africa":"Mozambique"))}">🌐 ${tx("Soek die hele internet","Search the web")}</a></div>`;
}

function addPrice(barcode,name){
const shop=$("shopName").value.trim();
const price=Number($("shopPrice").value);
const currency=$("shopCurrency").value;
const url=$("shopUrl").value.trim();
if(!shop||!Number.isFinite(price)||price<=0){
alert(tx("Vul winkel en geldige prys in.","Enter store and valid price."));return;
}
if(url&&!/^https?:\/\/\S+$/i.test(url)){
alert(tx("Ongeldige webskakel.","Invalid URL."));return;
}
data.prices.push({
id:uid(),barcode,name,shop,price,currency,url,
date:new Date().toISOString()
});
save();
compare("",window.currentCompare);
}

function savedPrices(){
const p=window.currentCompare;
const arr=data.prices.filter(x=>x.barcode===p.barcode||(x.name&&x.name===p.name));
if(!arr.length){
$("savedPrices").innerHTML=`<p>${tx("Nog geen pryse gestoor nie.","No prices saved yet.")}</p>`;
return;
}
const latest=new Map();
arr.forEach(x=>latest.set(x.shop+"|"+x.currency,x));
const values=[...latest.values()].sort((a,b)=>a.currency.localeCompare(b.currency)||a.price-b.price);
$("savedPrices").innerHTML=values.map(x=>{
const same=values.filter(y=>y.currency===x.currency);
const best=Math.min(...same.map(y=>Number(y.price)));
return `<div class="item">
<b>${esc(x.shop)}</b> ${x.price===best?`<span class="good">🏆 ${tx("Goedkoopste gestoor","Lowest saved")}</span>`:""}<br>
<strong>${money(x.price,x.currency)}</strong><br>
<span class="muted">${new Date(x.date).toLocaleDateString()} · ${tx("Handmatig bevestig","Manually confirmed")}</span><br>
${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${tx("Maak winkel oop","Open store")}</a>`:""}
<button class="btn secondary" style="padding:7px 10px" onclick="removePrice('${x.id}')">🗑️</button>
</div>`;
}).join("")+`<p class="muted">${tx("Rand en metical word apart vergelyk. Geen wisselkoers word geraai nie.","Rand and metical are compared separately. No exchange rate is guessed.")}</p>`;
}

function removePrice(id){
if(!confirm(tx("Verwyder hierdie prys?","Remove this price?")))return;
data.prices=data.prices.filter(x=>x.id!==id);
save();savedPrices();
}

function shopping(){
const needed=data.products.filter(p=>need(p)>0);
$("app").innerHTML=`
<section class="card">
<h2>🛒 ${tx("Outomatiese inkopielys","Automatic shopping list")}</h2>
${needed.length?needed.map(p=>`
<div class="item">
<b>${esc(p.name)}</b><br>
${tx("Koop","Buy")}: <strong>${need(p)} ${esc(p.unit||"items")}</strong><br>
<span class="muted">${tx("Geskatte koste","Estimated cost")}: ${money(need(p)*Number(p.price||0),p.currency||data.currency)}</span>
<div class="actions">
<button class="btn secondary" onclick="compare('${p.id}')">🔎 ${tx("Vergelyk pryse","Compare prices")}</button>
<button class="btn" onclick="buyNeeded('${p.id}')">✓ ${tx("Gekoop","Bought")}</button>
</div>
</div>`).join(""):`<p>${tx("Alles is op voorraad!","Everything is stocked!")}</p>`}
</section>
<section class="card">
<h2>📝 ${tx("Ekstra inkopielys","Extra shopping list")}</h2>
<div class="row"><input id="manualText" placeholder="${tx("Voeg item by","Add item")}"><button class="btn" onclick="addManual()">➕</button></div>
${data.manual.map((m,i)=>`<div class="item row"><div class="grow">${esc(typeof m==="string"?m:m.name||m.text||"Item")}</div><button class="btn secondary" onclick="removeManual(${i})">✓</button></div>`).join("")}
</section>`;
}

function buyNeeded(id){
const p=data.products.find(x=>x.id===id);
if(!p)return;
const qty=need(p);
if(qty<=0)return;
p.qty=Number(p.qty)+qty;
data.history.push({id:uid(),pid:id,type:"buy",qty,total:qty*Number(p.price||0),date:new Date().toISOString()});
save();render();
}

function addManual(){
const name=$("manualText").value.trim();
if(!name)return;
data.manual.push(name);
save();render();
}

function removeManual(i){
data.manual.splice(i,1);
save();render();
}

function settings(){
$("app").innerHTML=`
<section class="card">
<h2>⚙️ ${tx("Instellings","Settings")}</h2>
<label>${tx("Taal","Language")}</label>
<select id="language" onchange="data.lang=this.value;save();render()">
<option value="af" ${data.lang==="af"?"selected":""}>Afrikaans</option>
<option value="en" ${data.lang==="en"?"selected":""}>English</option>
</select>
<label>${tx("Geldeenheid","Currency")}</label>
<select id="currency" onchange="data.currency=this.value;save();render()">
<option value="ZAR" ${data.currency==="ZAR"?"selected":""}>🇿🇦 Rand – ZAR</option>
<option value="MZN" ${data.currency==="MZN"?"selected":""}>🇲🇿 Metical – MZN</option>
</select>
<label>${tx("Maandelikse begroting","Monthly budget")}</label>
<input id="budget" type="number" min="0" value="${data.budget||0}" onchange="data.budget=Number(this.value)||0;save()">
</section>
<section class="card">
<h2>💾 ${tx("Rugsteun en herstel","Backup and restore")}</h2>
<button class="btn full" onclick="backup()">⬇️ ${tx("Laai rugsteun af","Download backup")}</button>
<label>${tx("Herstel rugsteun","Restore backup")}</label>
<input type="file" accept=".json,application/json" onchange="restore(this)">
<p class="note">${tx("Data word op hierdie toestel se blaaier gestoor. Dit sinkroniseer nie outomaties tussen telefone nie. Maak gereeld 'n rugsteun.","Data is stored in this device's browser. It does not sync automatically between phones. Back up regularly.")}</p>
</section>
<section class="card">
<h2>🌸 My Home Stock</h2>
<p>${tx("Pink 3D Edition vir Louise","Pink 3D Edition for Louise")}</p>
<p class="muted">${tx("Internetpryssoektogte is skakels na winkels en soekenjins. Pryse word nie outomaties van winkelwebwerwe af ingelees nie.","Internet price searches link to stores and search engines. Prices are not automatically extracted from store websites.")}</p>
</section>`;
}

function backup(){
const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="my-home-stock-backup-"+new Date().toISOString().slice(0,10)+".json";
a.click();
setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function restore(input){
const file=input.files?.[0];
if(!file)return;
const r=new FileReader();
r.onload=()=>{
try{
const obj=JSON.parse(r.result);
if(!obj||!Array.isArray(obj.products))throw Error();
if(!confirm(tx("Vervang huidige data met rugsteun?","Replace current data with backup?")))return;
data={...fresh(),...obj};
data.manual=Array.isArray(data.manual)?data.manual:[];
data.history=Array.isArray(data.history)?data.history:[];
data.prices=Array.isArray(data.prices)?data.prices:[];
save();go("home");
}catch(e){alert(tx("Ongeldige rugsteunlêer.","Invalid backup file."));}
};
r.readAsText(file);
}

render();
</script>
</body>
</html>
